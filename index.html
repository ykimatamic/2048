<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>2048</title>
    <meta name="description" content="2048 puzzle game with AI autoplay — undo, hints, dark mode and offline play." />
    <meta property="og:title" content="2048" />
    <meta property="og:description" content="2048 puzzle game with AI autoplay — undo, hints, dark mode and offline play." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="theme-color" content="#faf8ef" />
    <script>
      // テーマ FOUC 対策: 描画前に localStorage / OS 設定から data-theme を適用する
      (function () {
        try {
          var t = localStorage.getItem("game2048:theme");
          if (t !== "light" && t !== "dark") {
            t =
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {
          /* noop */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
